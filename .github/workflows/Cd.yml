name: CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # Builds & pushes one image per service that has a Dockerfile:
  #   backend/Dockerfile, blockchain/Dockerfile, frontend/Dockerfile, ai/Dockerfile
  # Services without a Dockerfile are skipped automatically.
  publish-images:
    name: Publish image - ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, blockchain, frontend, ai]
    steps:
      - uses: actions/checkout@v4

      - name: Check for Dockerfile
        id: check
        run: |
          if [ -f "${{ matrix.service }}/Dockerfile" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.service }}/Dockerfile not found - skipping"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.check.outputs.exists == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        if: steps.check.outputs.exists == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        if: steps.check.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # Smart-contract deployment (manual, opt-in) - needs Sepolia secrets
  deploy-contract:
    name: Deploy smart contract (Sepolia)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && vars.DEPLOY_CONTRACT == 'true' }}
    environment: production
    timeout-minutes: 15
    defaults:
      run:
        working-directory: blockchain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Compile and deploy
        run: npm run deploy
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}

  # Server deployment over SSH (opt-in: set repo variable DEPLOY_ENABLED=true)
  deploy:
    name: Deploy to server (SSH)
    runs-on: ubuntu-latest
    needs: publish-images
    if: ${{ vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    environment: production
    timeout-minutes: 10
    steps:
      - name: Deploy backend over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr 'A-Z' 'a-z')-backend:latest"
            echo "${{ secrets.GHCR_PULL_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_PULL_USER }}" --password-stdin
            docker pull "$IMAGE"
            docker rm -f veriframe-backend || true
            docker run -d --name veriframe-backend --restart unless-stopped \
              -p 8080:8080 \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e DB_HOST="${{ secrets.DB_HOST }}" \
              -e DB_PORT="${{ secrets.DB_PORT || 5432 }}" \
              -e DB_NAME="${{ secrets.DB_NAME }}" \
              -e DB_USERNAME="${{ secrets.DB_USERNAME }}" \
              -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e SECURITY_API_KEY="${{ secrets.SECURITY_API_KEY }}" \
              -e FRONTEND_ORIGIN="${{ secrets.FRONTEND_ORIGIN }}" \
              -e CLOUDINARY_CLOUD_NAME="${{ secrets.CLOUDINARY_CLOUD_NAME }}" \
              -e CLOUDINARY_API_KEY="${{ secrets.CLOUDINARY_API_KEY }}" \
              -e CLOUDINARY_API_SECRET="${{ secrets.CLOUDINARY_API_SECRET }}" \
              -e BLOCKCHAIN_MODE="${{ vars.BLOCKCHAIN_MODE || 'MOCK' }}" \
              -e BLOCKCHAIN_SERVICE_URL="${{ vars.BLOCKCHAIN_SERVICE_URL }}" \
              "$IMAGE"
            docker image prune -f

      - name: Post-deploy health check
        if: ${{ vars.HEALTHCHECK_URL != '' }}
        run: |
          for i in $(seq 1 24); do
            if curl -fsS "${{ vars.HEALTHCHECK_URL }}" | grep -q '"status":"UP"'; then
              echo "Deployment healthy"; exit 0
            fi
            sleep 5
          done
          echo "Health check failed"; exit 1
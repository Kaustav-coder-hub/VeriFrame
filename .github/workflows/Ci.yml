name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ───────────────────────── Backend (Spring Boot) ─────────────────────────
  backend:
    name: Backend - build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw -B -ntp clean verify
        env:
          SPRING_PROFILES_ACTIVE: local
          BLOCKCHAIN_MODE: MOCK

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/media-provenance-backend-0.0.1-SNAPSHOT.jar
          retention-days: 7

  # ───────────────────────── Blockchain (Node + Solidity) ─────────────────────────
  blockchain:
    name: Blockchain - compile & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: blockchain
    steps:
      - uses: actions/checkout@v4

      # Node 22 required: `node --test "test/*.test.js"` glob patterns
      # are only supported by the Node test runner from v21 onwards.
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      # Compiles contracts/MediaProvenance.sol with solc, then runs node --test
      # (uses an in-process Ganache chain, no external RPC needed)
      - name: Compile contract and run tests
        run: npm test

  # ───────────────────────── Frontend (runs once a package.json exists) ─────────────────────────
  frontend:
    name: Frontend - lint, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Detect frontend project
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No frontend/package.json yet - skipping frontend checks"
          fi

      - name: Set up Node.js 20
        if: steps.detect.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        if: steps.detect.outputs.exists == 'true'
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lint
        if: steps.detect.outputs.exists == 'true'
        run: npm run lint --if-present

      - name: Test
        if: steps.detect.outputs.exists == 'true'
        run: npm test --if-present

      - name: Build
        if: steps.detect.outputs.exists == 'true'
        run: npm run build --if-present
        env:
          CI: "true"

  # ───────────────────────── AI (runs once Python deps exist) ─────────────────────────
  ai:
    name: AI - lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4

      - name: Detect Python project
        id: detect
        run: |
          if [ -f requirements.txt ] || [ -f pyproject.toml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No ai/requirements.txt or pyproject.toml yet - skipping AI checks"
          fi

      - name: Set up Python 3.11
        if: steps.detect.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.detect.outputs.exists == 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install .; fi
          pip install pytest ruff

      - name: Lint (ruff)
        if: steps.detect.outputs.exists == 'true'
        run: ruff check .

      - name: Test (pytest)
        if: steps.detect.outputs.exists == 'true'
        run: pytest -q || [ $? -eq 5 ]   # exit code 5 = no tests collected

  # ───────────────────────── Full stack Docker smoke test ─────────────────────────
  docker-smoke:
    name: Docker Compose - health check
    runs-on: ubuntu-latest
    needs: [backend]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL + backend (MOCK blockchain)
        run: docker compose up -d --build postgres backend
        env:
          SECURITY_API_KEY: ci-test-api-key
          BLOCKCHAIN_MODE: MOCK

      - name: Wait for backend health
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Backend is UP"; exit 0
            fi
            echo "Waiting for backend ($i/40)..."; sleep 5
          done
          echo "Backend did not become healthy"; exit 1

      - name: Auth is enforced on write endpoints
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8080/api/v1/media)
          echo "POST /api/v1/media without API key -> $code"
          test "$code" = "401"

      - name: Public verify endpoint rejects empty request
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8080/api/v1/verify \
            -F "mediaId=00000000-0000-0000-0000-000000000000")
          echo "POST /api/v1/verify (multipart, no file part) -> $code"
          test "$code" = "400"

      - name: Logs on failure
        if: failure()
        run: docker compose logs backend postgres

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ───────────────────────── Single required check for branch protection ─────────────────────────
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    if: always()
    needs: [backend, blockchain, frontend, ai, docker-smoke]
    steps:
      - name: Fail if any job failed or was cancelled
        run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ join(needs.*.result, ' ') }}' | grep -Eq 'failure|cancelled'; then
            exit 1
          fi
spring:
  datasource:
    url: jdbc:h2:mem:mediaprovenancedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoint:
    health:
      show-details: always

app:
  security:
    api-key: ${SECURITY_API_KEY:dev-secret-api-key-change-in-prod}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:demo}
    api-key: ${CLOUDINARY_API_KEY:1234567890}
    api-secret: ${CLOUDINARY_API_SECRET:abcdefghijklmnopqrstuvwxyz}

logging:
  level:
    root: INFO
    com.mediaprovenance: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

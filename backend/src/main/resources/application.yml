spring:
  application:
    name: media-provenance-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:10MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:12MB}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  security:
    api-key: ${SECURITY_API_KEY}
    header-name: X-API-KEY
  cors:
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:5173,http://localhost:3000}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}
    auto-tagging-categorization: ${CLOUDINARY_AUTO_TAGGING_CATEGORIZATION:aws_rek_tagging}
  blockchain:
    mode: ${BLOCKCHAIN_MODE:MOCK}
    service-url: ${BLOCKCHAIN_SERVICE_URL:http://localhost:4000}
    connect-timeout-ms: ${BLOCKCHAIN_CONNECT_TIMEOUT_MS:5000}
    read-timeout-standard-ms: ${BLOCKCHAIN_READ_TIMEOUT_STANDARD_MS:10000}
    read-timeout-long-ms: ${BLOCKCHAIN_READ_TIMEOUT_LONG_MS:120000}

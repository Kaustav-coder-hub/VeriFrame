version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: veriframe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mediaprovenance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mediaprovenance"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: veriframe-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: mediaprovenance
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SECURITY_API_KEY: ${SECURITY_API_KEY:-dev-secret-api-key-change-in-prod}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-demo}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-1234567890}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-abcdefghijklmnopqrstuvwxyz}
      CLOUDINARY_AUTO_TAGGING_CATEGORIZATION: ${CLOUDINARY_AUTO_TAGGING_CATEGORIZATION:-aws_rek_tagging}
      BLOCKCHAIN_MODE: ${BLOCKCHAIN_MODE:-MOCK}
      BLOCKCHAIN_SERVICE_URL: ${BLOCKCHAIN_SERVICE_URL:-http://blockchain:4000}
      BLOCKCHAIN_CONNECT_TIMEOUT_MS: ${BLOCKCHAIN_CONNECT_TIMEOUT_MS:-5000}
      BLOCKCHAIN_READ_TIMEOUT_STANDARD_MS: ${BLOCKCHAIN_READ_TIMEOUT_STANDARD_MS:-10000}
      BLOCKCHAIN_READ_TIMEOUT_LONG_MS: ${BLOCKCHAIN_READ_TIMEOUT_LONG_MS:-120000}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
